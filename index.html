<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-png" href="/assets/transparent_logo.png">
    <link rel="stylesheet" href="style.css">
    <title>Vending Machine</title>
</head>

<body>
    <main>
        <span class="title">Vending Machine Surveillance</span>
        <div class="content-container">
            <!-- Section for logged-out view -->
            <section id="logged-out-view">
                <div class="auth-page_container">
                    <div class="form-container">
                        <!-- Toggle buttons for sign in and sign up forms -->
                        <div class="toggle-container">
                            <div id="signin-toggle-btn" class="auth-toggle-signin">Login</div>
                            <div id="signup-toggle-btn" class="auth-toggle-signup">Sign Up</div>
                        </div>
                        <!-- Sign in form -->
                        <div id="signin-form" class="login-form-container">
                            <div class="login-form">
                                <h2>Login</h2>
                                <div class="input-group">
                                    <input type="email" id="signin-email-input" name="email" placeholder="Email"
                                        required>
                                    <div id="email-error-message" class="error-msg"></div>
                                </div>
                                <div class="input-group">
                                    <input type="password" id="signin-password-input" name="password"
                                        placeholder="Password" required>
                                    <div id="password-error-message" class="error-msg"></div>
                                </div>
                                <div id="sign-in-btn" class="login-btn">Sign In</div>
                            </div>
                        </div>
                        <!-- Sign up form -->
                        <div id="signup-form" class="login-form-container">
                            <div class="login-form">
                                <h2>Sign Up</h2>
                                <div class="input-group">
                                    <input type="email" id="signup-email-input" name="email" placeholder="Email"
                                        required>
                                    <div id="email-error-message" class="error-msg"></div>
                                </div>
                                <div class="input-group">
                                    <input type="password" id="signup-password-input" name="password"
                                        placeholder="Password" required>
                                    <div id="password-error-message" class="error-msg"></div>
                                </div>
                                <div class="input-group">
                                    <input type="RFID_kennung" id="rfid-input" name="RFID" placeholder="RFID-Tag (XX XX XX XX)"
                                        required>
                                </div>
                                <div id="sign-up-btn" class="login-btn">Create Account</div>

                            </div>
                        </div>
                    </div>
                </div>
            </section>


            <!-- Section for logged-in view -->
            <section id="logged-in-view-host">
                <div class="container">
                    <button id="reloadBtn">Reload</button>

                    <label for="slot1_field">Slot 1</label>
                    <div id="one_line">
                        <input type="number_in" id="slot1_amount" placeholder="X" />
                        <input type="product_name" id="slot1_field" placeholder="Reload for value" />
                        <input type="price_in" id="slot1_price" placeholder="X" />
                    </div>
                    <label for="slot2_field">Slot 2</label>
                    <div id="one_line">
                        <input type="number_in" id="slot2_amount" placeholder="X" />
                        <input type="product_name" id="slot2_field" placeholder="Reload for value" />
                        <input type="price_in" id="slot2_price" placeholder="X" />
                    </div>
                    <label for="slot3_field">Slot 3</label>
                    <div id="one_line">
                        <input type="number_in" id="slot3_amount" placeholder="X" />
                        <input type="product_name" id="slot3_field" placeholder="Reload for value" />
                        <input type="price_in" id="slot3_price" placeholder="X" />
                    </div>
                    <label for="slot4_field">Slot 4</label>
                    <div id="one_line">
                        <input type="number_in" id="slot4_amount" placeholder="X" />
                        <input type="product_name" id="slot4_field" placeholder="Reload for value" />
                        <input type="price_in" id="slot4_price" placeholder="X" />
                    </div>
                    <label for="slot5_field">Slot 5</label>
                    <div id="one_line">
                        <input type="number_in" id="slot5_amount" placeholder="X" />
                        <input type="product_name" id="slot5_field" placeholder="Reload for value" />
                        <input type="price_in" id="slot5_price" placeholder="X" />
                    </div>
                    <label for="slot6_field">Slot 6</label>
                    <div id="one_line">
                        <input type="number_in" id="slot6_amount" placeholder="X" />
                        <input type="product_name" id="slot6_field" placeholder="Reload for value" />
                        <input type="price_in" id="slot6_price" placeholder="X" />
                    </div>

                    <button id="apply_changes_button">Apply Changes</button>

                    <label for="user_name_input">User email</label>
                    <input type="text" id="username_field" placeholder="User">

                    <label for="user_added_credit_input">Credit</label>
                    <input type="text" id="credit_field" placeholder="Credit in Euros e.g.10">

                    <button id="apply_credit_button">Add Credit</button>


                    <label for="rgb_r_input">RGB-LED red value</label>
                    <input type="text" id="r_input" placeholder="Rot (0-255)">

                    <label for="rgb_g_input">RGB-LED green value</label>
                    <input type="text" id="g_input" placeholder="Grün (0-255)">

                    <label for="rgb_b_input">RGB-LED blue value</label>
                    <input type="text" id="b_input" placeholder="Blau (0-255)">

                    <button id="set_rgb_button">Set Colors</button>

                    <img src="assets/transparent_logo.png">
                    <div class="top-section">
                        <h2 class="greeting">You are logged in as <span id="user-email"></span>.</h2>
                    </div>
                    <button id="logout-button" class="logout-btn">Logout</button>
            </section>

            <section id="logged-in-view-user">
                <div class="container">
                    <button id="reloadBtn2">Reload</button>

                    <label for="slot1_field">Slot 1</label>
                    <div id="one_line">
                        <input type="number_in" id="slot1_amount2" placeholder="X" readonly />
                        <input type="product_name" id="slot1_field2" placeholder="Reload for value" readonly />
                        <input type="price_in" id="slot1_price2" placeholder="X" readonly />
                    </div>
                    <label for="slot2_field">Slot 2</label>
                    <div id="one_line">
                        <input type="number_in" id="slot2_amount2" placeholder="X" readonly />
                        <input type="product_name" id="slot2_field2" placeholder="Reload for value" readonly />
                        <input type="price_in" id="slot2_price2" placeholder="X" readonly />
                    </div>
                    <label for="slot3_field">Slot 3</label>
                    <div id="one_line">
                        <input type="number_in" id="slot3_amount2" placeholder="X" readonly />
                        <input type="product_name" id="slot3_field2" placeholder="Reload for value" readonly />
                        <input type="price_in" id="slot3_price2" placeholder="X" readonly />
                    </div>
                    <label for="slot4_field">Slot 4</label>
                    <div id="one_line">
                        <input type="number_in" id="slot4_amount2" placeholder="X" readonly />
                        <input type="product_name" id="slot4_field2" placeholder="Reload for value" readonly />
                        <input type="price_in" id="slot4_price2" placeholder="X" readonly />
                    </div>
                    <label for="slot5_field">Slot 5</label>
                    <div id="one_line">
                        <input type="number_in" id="slot5_amount2" placeholder="X" readonly />
                        <input type="product_name" id="slot5_field2" placeholder="Reload for value" readonly />
                        <input type="price_in" id="slot5_price2" placeholder="X" readonly />
                    </div>
                    <label for="slot6_field">Slot 6</label>
                    <div id="one_line">
                        <input type="number_in" id="slot6_amount2" placeholder="X" readonly />
                        <input type="product_name" id="slot6_field2" placeholder="Reload for value" readonly />
                        <input type="price_in" id="slot6_price2" placeholder="X" readonly />
                    </div>

                    <label for="user_added_credit_input">Credit</label>
                    <input type="text" id="credit_field2" placeholder="Credit in Euros e.g.10" readonly >

                    <img src="assets/transparent_logo.png">
                    <div class="top-section">
                        <h2 class="greeting">You are logged in as <span id="user-email2"></span>.</h2>
                    </div>
                    <button id="logout-button2" class="logout-btn">Logout</button>
            </section>
        </div>
        </div>
    </main>

    <!-- Script to toggle between signin and signup forms -->
    <script>
        const signinToggleBtn = document.getElementById("signin-toggle-btn");
        const signupToggleBtn = document.getElementById("signup-toggle-btn");
        const signInFormView = document.getElementById("signin-form");
        const signUpFormView = document.getElementById("signup-form");

        signinToggleBtn.addEventListener('click', () => {
            signInFormView.style.display = 'block';
            signUpFormView.style.display = 'none';
            signinToggleBtn.style.backgroundColor = '#F33F0A';
            signinToggleBtn.style.color = 'white';
            signupToggleBtn.style.backgroundColor = 'lightgrey';
            signupToggleBtn.style.color = 'black';
        });

        signupToggleBtn.addEventListener('click', () => {
            signInFormView.style.display = 'none';
            signUpFormView.style.display = 'block';
            signinToggleBtn.style.backgroundColor = 'lightgrey';
            signinToggleBtn.style.color = 'black';
            signupToggleBtn.style.backgroundColor = '#F33F0A';
            signupToggleBtn.style.color = 'white';
        });
    </script>

    <!-- Import external script -->
    <script type="module" src="script.js"></script>
</body>

</html>
